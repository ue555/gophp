name: php-version

x-php: &php
  working_dir: /Users/kouji/dev/php
  command: ["php", "-n", "-r", "while (true) { sleep(3600); }"]
  environment:
    LC_ALL: C
    LANG: C
    TZ: UTC
  volumes:
    - /Users/kouji/dev/php:/Users/kouji/dev/php:ro
    - /Users/kouji/docker/php-version:/Users/kouji/docker/php-version:ro

services:
  php83:
    <<: *php
    image: docker.io/library/php:8.3.35-cli-bookworm
    container_name: php-version-83
  php84:
    <<: *php
    image: docker.io/library/php:8.4.26-cli-bookworm
    container_name: php-version-84
  php85:
    <<: *php
    image: docker.io/library/php:8.5.11-cli-bookworm
    container_name: php-version-85
