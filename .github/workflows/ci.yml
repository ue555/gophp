name: Compatibility and fixed apps
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3.35', '8.4.26', '8.5.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache: false
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev libpcre2-dev python3
      - name: Rebuild fixed dependencies and run every release gate
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: >-
          python3 -u scripts/verify-release.py
          --engine docker --version "$PHP_VERSION"
          --build-images --require-fresh-vendor --output-root .cache/ci
      - name: Save commands, source identities, failures and HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.php }}-${{ github.sha }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
